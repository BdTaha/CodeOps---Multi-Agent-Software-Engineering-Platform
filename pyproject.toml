[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-engineering"
version = "0.1.0"
description = "Backend for the Autonomous Software Engineering Multi-Agent System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "uvicorn>=0.30,<1.0",
    "langgraph>=1.0,<2.0",
    "packaging>=24,<27",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2>=2.13,<3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autonomous_engineering = ["monitor.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The optional shared cache can have different Windows ownership between
# sandbox and terminal runs. Keep tests independent of its permissions.
addopts = "-ra -p no:cacheprovider"
