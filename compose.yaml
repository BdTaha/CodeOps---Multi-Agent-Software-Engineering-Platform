services:
  postgres:
    image: postgres:17
    container_name: ase-postgres-dev
    environment:
      POSTGRES_USER: engineering
      POSTGRES_PASSWORD: ${ASE_POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: engineering
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engineering -d engineering"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
    name: ase-postgres-dev
